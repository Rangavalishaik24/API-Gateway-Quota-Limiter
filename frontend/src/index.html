<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <title>API Gateway – Dynamic Quota Limiter & Document Search</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>" />

  <!-- Fonts: Inter (UI) + JetBrains Mono (telemetry, keys, timings) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet"
  />

  <!-- Tailwind CSS (play CDN, pinned version) -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            obsidian: {
              950: '#0B0F19',
              900: '#111827',
              850: '#151C2C',
              800: '#1A2234',
              700: '#273046',
            },
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Consolas', 'monospace'],
          },
          boxShadow: {
            glow: '0 0 0 1px rgba(99,102,241,.45), 0 10px 32px -10px rgba(99,102,241,.55)',
            'glow-emerald': '0 0 0 1px rgba(16,185,129,.45), 0 10px 32px -12px rgba(16,185,129,.55)',
            'glow-crimson': '0 0 0 1px rgba(239,68,68,.6), 0 10px 40px -8px rgba(239,68,68,.6)',
          },
        },
      },
    };
  </script>
</head>
<body class="bg-obsidian-950 text-slate-200 font-sans antialiased">
  <app-root>
    <div style="min-height:100vh;display:grid;place-items:center;color:#94A3B8;font-family:Inter,system-ui,sans-serif;background:#0B0F19">
      Starting gateway console…
    </div>
  </app-root>
</body>
</html>
